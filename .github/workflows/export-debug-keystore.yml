name: Export Debug Keystore

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-debug-keystore.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload debug keystore
        uses: actions/upload-artifact@v4
        with:
          name: astralforge-debug-keystore
          path: app/astralforge-debug.keystore
          if-no-files-found: error
